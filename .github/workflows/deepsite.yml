name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 设置时间戳
        id: timestamp
        run: echo "timestamp=$(date +%s)" >> $GITHUB_OUTPUT

      - name: 构建 Docker 镜像
        run: docker build . -f Dockerfile -t deepsite:${{ steps.timestamp.outputs.timestamp }}

      - name: 保存镜像成 tar 文件
        run: docker save deepsite:${{ steps.timestamp.outputs.timestamp }} -o deepsite-${{ steps.timestamp.outputs.timestamp }}.tar

      - name: 上传镜像到 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepsite-image-${{ steps.timestamp.outputs.timestamp }}
          path: deepsite-${{ steps.timestamp.outputs.timestamp }}.tar
